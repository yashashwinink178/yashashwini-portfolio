<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Yashashwini</title>

    <meta name="description"
          content="Contact Yashashwini through the accessible contact form.">
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Get In Touch</h2>

            <form aria-label="Contact form">

                <p>
                    <label for="name">Name:</label>
                    <input type="text"
                           id="name"
                           name="name"
                           required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email"
                           id="email"
                           name="email"
                           required>
                </p>

                <p>
                    <label for="message">Message:</label>
                    <textarea id="message"
                              name="message"
                              rows="5"
                              required></textarea>
                </p>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Yashashwini</p>
    </footer>

</body>

</html>
